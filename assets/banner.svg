<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Pranjal Maurya, Cybersecurity · Software Dev · AI Engineer">
  <title>Pranjal Maurya, Cybersecurity · Software Dev · AI Engineer</title>
  <defs>
    <clipPath id="card"><rect width="1200" height="320" rx="24"/></clipPath>
    <linearGradient id="name" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0" spreadMethod="repeat">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="0.35" stop-color="#22d3ee"/>
      <stop offset="0.65" stop-color="#f472b6"/>
      <stop offset="1" stop-color="#a78bfa"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="900 0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" x2="1">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="0.5" stop-color="#22d3ee"/><stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="hub"><stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#7c3aed"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045"/>
    </pattern>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
    <filter id="glow"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="#0d1117"/>
    <g filter="url(#blur)" opacity="0.55">
      <circle r="150" fill="#7c3aed">
        <animate attributeName="cx" values="150;320;150" dur="18s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="60;140;60" dur="14s" repeatCount="indefinite"/>
      </circle>
      <circle r="130" fill="#0891b2">
        <animate attributeName="cx" values="1050;880;1050" dur="16s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="280;200;280" dur="12s" repeatCount="indefinite"/>
      </circle>
      <circle r="90" fill="#db2777" opacity="0.6">
        <animate attributeName="cx" values="640;760;640" dur="20s" repeatCount="indefinite"/>
        <animate attributeName="cy" values="330;260;330" dur="15s" repeatCount="indefinite"/>
      </circle>
    </g>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <!-- status pill -->
    <g transform="translate(64 58)">
      <rect width="191.79999999999998" height="30" rx="15" fill="#ffffff" fill-opacity="0.06" stroke="#30363d"/>
      <circle cx="18" cy="15" r="5" fill="#3fb950">
        <animate attributeName="opacity" values="1;0.35;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="32" y="20" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="14" font-weight="600" fill="#c9d1d9">Open to collaborate</text>
    </g>

    <text x="62" y="165" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="68" font-weight="800" letter-spacing="-1.5" fill="url(#name)">Pranjal Maurya</text>
    <text x="64" y="216.2" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="22" font-weight="600" fill="#22d3ee">&gt; <tspan fill="#c9d1d9">Cybersecurity · Software Dev · AI Engineer</tspan><tspan fill="#a78bfa">_<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/></tspan></text>
    <text x="64" y="258.2" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="18" fill="#8b949e">Breaking systems to secure them · building software &amp; AI that ships.</text>

    <!-- agent graph -->
    <g>
    <line x1="965" y1="60" x2="1051.6" y2="110" stroke="#30363d" stroke-width="1.5"/>
    <line x1="1051.6" y1="110" x2="1051.6" y2="210" stroke="#30363d" stroke-width="1.5"/>
    <line x1="1051.6" y1="210" x2="965" y2="260" stroke="#30363d" stroke-width="1.5"/>
    <line x1="965" y1="260" x2="878.4" y2="210" stroke="#30363d" stroke-width="1.5"/>
    <line x1="878.4" y1="210" x2="878.4" y2="110" stroke="#30363d" stroke-width="1.5"/>
    <line x1="878.4" y1="110" x2="965" y2="60" stroke="#30363d" stroke-width="1.5"/>
    
    <line x1="965" y1="160" x2="965" y2="60" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="965" y1="160" x2="1051.6" y2="110" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="965" y1="160" x2="1051.6" y2="210" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <line x1="965" y1="160" x2="965" y2="260" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="965" y1="160" x2="878.4" y2="210" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="2.6s" repeatCount="indefinite"/>
    </line>
    <line x1="965" y1="160" x2="878.4" y2="110" stroke="url(#edge)" stroke-width="2" stroke-dasharray="6 8">
      <animate attributeName="stroke-dashoffset" from="0" to="-56" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <circle cx="965" cy="160" r="36" fill="url(#hub)" filter="url(#glow)">
      <animate attributeName="r" values="34;38;34" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <text x="965" y="166" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="17" font-weight="800" fill="#ffffff">&lt;/&gt;</text>
    
    <g>
      <circle cx="965" cy="60" r="22" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="0s" repeatCount="indefinite"/>
      </circle>
      <text x="965" y="64" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">SEC</text>
    </g>
    <g>
      <circle cx="1051.6" cy="110" r="22" fill="#0d1117" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="0.5s" repeatCount="indefinite"/>
      </circle>
      <text x="1051.6" y="114" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">AI</text>
    </g>
    <g>
      <circle cx="1051.6" cy="210" r="22" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="1051.6" y="214" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">API</text>
    </g>
    <g>
      <circle cx="965" cy="260" r="22" fill="#0d1117" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </circle>
      <text x="965" y="264" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">RE</text>
    </g>
    <g>
      <circle cx="878.4" cy="210" r="22" fill="#0d1117" stroke="#a78bfa" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="2s" repeatCount="indefinite"/>
      </circle>
      <text x="878.4" y="214" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">CTF</text>
    </g>
    <g>
      <circle cx="878.4" cy="110" r="22" fill="#0d1117" stroke="#22d3ee" stroke-width="2">
        <animate attributeName="r" values="22;25;22" dur="3s" begin="2.5s" repeatCount="indefinite"/>
      </circle>
      <text x="878.4" y="114" text-anchor="middle" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="11" font-weight="700" fill="#c9d1d9">DEV</text>
    </g>
    </g>

    <rect y="314" width="1200" height="6" fill="url(#bar)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="319" rx="23.5" fill="none" stroke="#30363d"/>
</svg>
